name: Preview

# Builds a static export of the site and publishes it to GitHub Pages so there
# is a shareable preview URL. The preview is built with NEXT_PUBLIC_NOINDEX so
# it never competes with the production domain in search results.
#
# One-time repo setup, needed before the deploy job can succeed:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# The build job runs and validates the export regardless.

on:
  push:
    branches:
      - main
      - cursor/kamo-pk-personal-brand-site-91df
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Derived rather than read from actions/configure-pages, which needs repo
      # admin rights the workflow token doesn't have until Pages is enabled.
      - name: Build static export
        run: npm run build
        env:
          NEXT_OUTPUT: export
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          NEXT_PUBLIC_NOINDEX: "true"

      # Without this, Pages' Jekyll pass drops the _next directory.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
